name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, database and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gerpy_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerpy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      AUTH_SECRET: ci-auth-secret-at-least-32-characters
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gerpy_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/gerpy_ci
      MFA_ENCRYPTION_KEY: ci-mfa-key-at-least-32-characters
      NEXTAUTH_SECRET: ci-auth-secret-at-least-32-characters
      NEXTAUTH_URL: http://127.0.0.1:3100
      PLAYWRIGHT_PORT: "3100"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create local RLS execution role
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles WHERE rolname = 'authenticated'
            ) THEN
              CREATE ROLE authenticated
                NOLOGIN
                NOSUPERUSER
                NOCREATEDB
                NOCREATEROLE
                NOINHERIT
                NOBYPASSRLS;
            END IF;
          END;
          $$;
          GRANT authenticated TO postgres;
          SQL

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: |
          npm run test:auth
          npm run test:api

      - name: Tenant isolation integration test
        run: >-
          node --experimental-strip-types --test
          scripts/tenant-isolation.test.mjs

      - name: Core backend integration test
        run: npm run test:core-integration

      - name: Session revocation integration test
        run: npm run test:session

      - name: Seed isolated E2E database
        run: npx prisma db seed

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
