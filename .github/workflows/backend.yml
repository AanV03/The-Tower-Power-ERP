name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gerpy_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerpy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      AUTH_SECRET: ci-auth-secret-at-least-32-characters
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gerpy_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/gerpy_ci
      MFA_ENCRYPTION_KEY: ci-mfa-key-at-least-32-characters
      NEXTAUTH_SECRET: ci-auth-secret-at-least-32-characters
      NEXTAUTH_URL: http://127.0.0.1:3100

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Bootstrap Supabase roles
        run: |
          psql $DATABASE_URL -c "CREATE ROLE authenticated NOLOGIN;" || true
          psql $DATABASE_URL -c "CREATE ROLE anon NOLOGIN;" || true
          psql $DATABASE_URL -c "CREATE ROLE service_role NOLOGIN;" || true

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
